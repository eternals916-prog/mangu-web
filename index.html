<html lang="mn">
<head>
  <meta charset="UTF-8">

  <title>MANGU Web — Орчуулагч</title>
  <style>
    * {
      box-sizing: border-box;
    }

    }

      color: #b8c5d8;

    main {
      width: min(700px, 92%);

      margin-top: 0;

      display: block;

    textarea {
      width: 100%;
      min-height: 170px;
      padding: 15px;

    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      background: #69e6cf;

      border: none;
      border-radius: 10px;
      font-size: 16px;

    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

      color: #ffd479;

      overflow-wrap: anywhere;
    }

  </style>

<body>
  <header>
    <h1>MANGU Web</h1>
    <p>Текстийг Монгол хэл рүү орчуулах</p>
  </header>

  <main>
    <h2>Монгол орчуулагч</h2>

    <label for="source">Орчуулах текстээ оруулна уу</label>
    <textarea id="source" placeholder="Энд текстээ бичиж эсвэл хуулж тавина уу..."></textarea>

    <button id="translate">Монгол хэл рүү орчуулах</button>

    <label for="result">Орчуулгын үр дүн</label>
    <textarea id="result" placeholder="Орчуулга энд гарна..." readonly></textarea>

    <p id="status" role="status"></p>
  </main>

  <footer>MANGU Web © 2026</footer>

  <script>
    const source = document.getElementById("source");
    const result = document.getElementById("result");
    const button = document.getElementById("translate");
    const status = document.getElementById("status");

    button.addEventListener("click", async () => {
      const text = source.value.trim();

      if (!text) {
        status.textContent = "Эхлээд орчуулах текстээ оруулна уу.";
        return;
      }

      button.disabled = true;
      status.textContent = "Орчуулж байна...";
      result.value = "";

      try {
        const response = await fetch("/api/translate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ text })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Орчуулга амжилтгүй боллоо.");
        }

        result.value = data.translatedText;
        status.textContent = "Орчуулга амжилттай дууслаа.";
      } catch (error) {
        status.textContent =
          "Алдаа: " + error.message +
          "\nСервер болон орчуулгын API тохиргоог шалгана уу.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
