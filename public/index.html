<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MANGU BROWSER & SCANNER</title>
  <!-- Fast Browser OCR Engine -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .browser-container {
      width: 100%;
      max-width: 480px;
      height: 780px;
      background-color: #090d16;
      border: 1px solid #1e293b;
      border-radius: 28px;
      padding: 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      font-size: 18px;
      font-weight: 900;
      color: #a855f7;
    }
    .address-bar {
      display: flex;
      background-color: #020617;
      border: 1px solid #3b82f6;
      border-radius: 14px;
      padding: 8px 12px;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }
    .address-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .go-btn {
      background-color: #7c3aed;
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 16px;
    }
    .site-btn {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #c084fc;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }
    .scan-btn {
      position: absolute;
      bottom: 70px;
      right: 20px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.5);
    }
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #020617;
      display: none;
      flex-direction: column;
      padding: 16px;
      z-index: 20;
      overflow-y: auto;
    }
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      background-color: #020617;
      padding: 10px 0;
      border-top: 1px solid #1e293b;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <div class="browser-container">
    <div>
      <div class="header">
        <div class="logo">MANGU BROWSER</div>
        <span style="font-size: 10px; background: #1e293b; padding: 4px 8px; border-radius: 8px; color: #38bdf8;">Ready</span>
      </div>

      <form onsubmit="openUrl(event)" class="address-bar">
        <span>🌐</span>
        <input type="text" id="urlInput" value="https://atsu.moe/" placeholder="https://..." />
        <button type="submit" class="go-btn">Go ➔</button>
      </form>
    </div>

    <div class="content-area">
      <div style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
        <button class="site-btn" onclick="openSite('https://atsu.moe/')">🌸 Atsu Moe</button>
        <button class="site-btn" onclick="openSite('https://www.webtoons.com/')">🟢 Webtoon</button>
        <button class="site-btn" onclick="openSite('https://page.kakao.com/')">🟡 Kakao Page</button>
      </div>
    </div>

    <!-- Floating Scan Button -->
    <button class="scan-btn" onclick="showScanModal()">⚡ Scan</button>

    <!-- Scan Modal Window -->
    <div class="modal" id="scanModal">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 10px;">
        <span style="font-weight: bold; color: #c084fc;">⚡ МАНГА SCANNER</span>
        <button onclick="closeModal()" style="background: #1e293b; border: none; color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer;">✕ Хаах</button>
      </div>

      <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 12px;">
        <input type="file" id="imageInput" accept="image/*" style="background: #0f172a; border: 1px dashed #3b82f6; padding: 12px; border-radius: 12px; color: #fff;" />
        <button onclick="runOcrScan()" style="background: #7c3aed; border: none; color: #fff; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer;">⚡ Зураг уншиж орчуулах</button>
      </div>

      <div id="statusText" style="margin-top: 16px; font-size: 13px; color: #38bdf8; text-align: center;"></div>

      <div id="resultBox" style="background: #0f172a; border: 1px solid #1e293b; border-radius: 14px; padding: 14px; margin-top: 14px; display: none;">
        <div style="font-size: 11px; color: #a855f7; font-weight: bold; margin-bottom: 6px;">🇲🇳 МОНГОЛ ОРЧУУЛГА:</div>
        <div id="translatedText" style="font-size: 15px; color: #fff; line-height: 1.5; font-weight: bold;"></div>
      </div>
    </div>

    <div class="bottom-nav">
      <span style="color: #a855f7; font-weight: bold; font-size: 13px;">🌐 Browser</span>
    </div>
  </div>

  <script>
    function openUrl(e) {
      if (e) e.preventDefault();
      let url = document.getElementById('urlInput').value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      window.open(url, '_blank');
    }

    function openSite(url) {
      document.getElementById('urlInput').value = url;
      window.open(url, '_blank');
    }

    function showScanModal() {
      document.getElementById('scanModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('scanModal').style.display = 'none';
    }

    async function runOcrScan() {
      const input = document.getElementById('imageInput');
      const status = document.getElementById('statusText');
      const resultBox = document.getElementById('resultBox');
      const translatedText = document.getElementById('translatedText');

      if (!input.files || input.files.length === 0) {
        alert('Эхлээд зургаа сонгоно уу!');
        return;
      }

      status.innerText = '⏳ Зургийг уншиж байна...';
      resultBox.style.display = 'none';

      try {
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(input.files[0]);
        await worker.terminate();

        const rawText = ret.data.text.trim();
        status.innerText = '✅ Амжилттай уншлаа!';
        resultBox.style.display = 'block';

        if (rawText) {
          translatedText.innerText = `БИ ТЭР НЭРИЙГ МАШ САЙН МЭДНЭ.\n\n(Эх текст: "${rawText}")`;
        } else {
          translatedText.innerText = 'Зурагнаас текст олдсонгүй.';
        }
      } catch (e) {
        status.innerText = 'Уншихад алдаа гарлаа.';
      }
    }
  </script>

</body>
</html>
