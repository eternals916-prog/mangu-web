<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MANGU BROWSER</title>
  <!-- Tesseract.js CDN for Browser OCR -->
  <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .browser-container {
      width: 100%;
      max-width: 480px;
      height: 780px;
      background-color: #090d16;
      border: 1px solid #1e293b;
      border-radius: 28px;
      padding: 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      font-size: 18px;
      font-weight: 900;
      color: #a855f7;
    }
    .address-bar {
      display: flex;
      background-color: #020617;
      border: 1px solid #3b82f6;
      border-radius: 14px;
      padding: 8px 12px;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }
    .address-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .go-btn {
      background-color: #7c3aed;
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 16px;
    }
    .quick-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .site-btn {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #c084fc;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .site-btn:hover {
      background-color: #1e293b;
      border-color: #a855f7;
    }
    /* Floating Scan Button (Бичлэг дээрх шиг) */
    .scan-floating-btn {
      position: absolute;
      bottom: 70px;
      right: 20px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }
    /* Scan Modal / Reader View */
    .scan-modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #020617;
      display: none;
      flex-direction: column;
      padding: 16px;
      z-index: 20;
      overflow-y: auto;
    }
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      background-color: #020617;
      padding: 10px 0;
      border-top: 1px solid #1e293b;
      border-radius: 20px;
    }
    .nav-btn {
      background: none;
      border: none;
      color: #a855f7;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="browser-container">
    <div>
      <div class="header">
        <div class="logo">MANGU BROWSER</div>
        <span style="font-size: 10px; background: #1e293b; padding: 4px 8px; border-radius: 8px; color: #38bdf8;">Scan Ready</span>
      </div>

      <!-- Address Bar -->
      <form onsubmit="navigate(event)" class="address-bar">
        <span>🌐</span>
        <input type="text" id="urlInput" value="https://atsu.moe/" placeholder="https://..." />
        <button type="submit" class="go-btn">Go ➔</button>
      </form>
    </div>

    <!-- Content / Quick Links -->
    <div class="content-area">
      <div style="width: 100%;">
        <div style="font-size: 13px; color: #94a3b8; margin-bottom: 12px; text-align: left;">Түргэн хандах сайтууд:</div>
        <div class="quick-links">
          <button class="site-btn" onclick="openExternal('https://atsu.moe/')">🌸 Atsu Moe (atsu.moe)</button>
          <button class="site-btn" onclick="openExternal('https://www.webtoons.com/')">🟢 Webtoon (webtoons.com)</button>
          <button class="site-btn" onclick="openExternal('https://page.kakao.com/')">🟡 Kakao Page (page.kakao.com)</button>
        </div>
      </div>
    </div>

    <!-- Floating Scan Button (Бичлэг дээрх шиг) -->
    <button class="scan-floating-btn" onclick="triggerScan()">
      <span>⚡</span> Scan
    </button>

    <!-- Scan Results View -->
    <div class="scan-modal" id="scanModal">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 10px;">
        <span style="font-weight: bold; color: #c084fc;">⚡ МАНГА СКАНЕР</span>
        <button onclick="closeScanModal()" style="background: #1e293b; border: none; color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer;">✕ Хаах</button>
      </div>

      <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 12px;">
        <input type="file" id="mangaImage" accept="image/*" style="background: #0f172a; border: 1px dashed #3b82f6; padding: 12px; border-radius: 12px; color: #fff;" />
        <button onclick="processScan()" style="background: #7c3aed; border: none; color: #fff; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer;">Зураг SCAN хийж орчуулах</button>
      </div>

      <div id="scanStatus" style="margin-top: 16px; font-size: 13px; color: #38bdf8; text-align: center;"></div>
      
      <div id="scanResultBox" style="background: #0f172a; border: 1px solid #1e293b; border-radius: 14px; padding: 14px; margin-top: 14px; display: none;">
        <div style="font-size: 11px; color: #a855f7; font-weight: bold; margin-bottom: 6px;">🇲🇳 МОНГОЛ ОРЧУУЛГА:</div>
        <div id="translatedOutput" style="font-size: 15px; color: #fff; line-height: 1.5; font-weight: bold;"></div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <button class="nav-btn">🌐 Browser</button>
      <button class="nav-btn" style="color: #64748b;">🕒 History</button>
    </div>
  </div>

  <script>
    function navigate(e) {
      if (e) e.preventDefault();
      let url = document.getElementById('urlInput').value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      window.open(url, '_blank');
    }

    function openExternal(url) {
      document.getElementById('urlInput').value = url;
      window.open(url, '_blank');
    }

    function triggerScan() {
      document.getElementById('scanModal').style.display = 'flex';
    }

    function closeScanModal() {
      document.getElementById('scanModal').style.display = 'none';
    }

    async function processScan() {
