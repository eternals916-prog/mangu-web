<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MANGU BROWSER</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #090d16;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 850px;
      background-color: #020617;
      border: 1px solid #1e293b;
      border-radius: 28px;
      padding: 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .header h2 {
      margin: 0;
      font-size: 20px;
      color: #a855f7;
      font-weight: 900;
    }
    .search-box {
      display: flex;
      gap: 8px;
      background-color: #0f172a;
      border: 1px solid #3b82f6;
      border-radius: 14px;
      padding: 8px 10px;
      margin-top: 12px;
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .search-box button {
      background-color: #7c3aed;
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      margin: 14px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
    }
    .site-item {
      padding: 12px;
      background: #1e293b;
      border-radius: 12px;
      cursor: pointer;
      color: #c084fc;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 8px;
      border: 1px solid #334155;
    }
    .site-item:hover {
      background: #334155;
    }
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      background-color: #0b1329;
      padding: 12px 0;
      border-top: 1px solid #1e293b;
      border-radius: 20px;
    }
    .nav-btn {
      background: none;
      border: none;
      color: #a855f7;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div>
      <div class="header">
        <h2>MANGU BROWSER</h2>
        <span style="font-size: 11px; background: #1e293b; padding: 4px 8px; border-radius: 8px; color: #38bdf8;">Online</span>
      </div>

      <!-- Address Bar -->
      <form onsubmit="openSite(event)" class="search-box">
        <span style="font-size: 16px;">🌐</span>
        <input type="text" id="urlInput" value="https://atsu.moe/" placeholder="https://..." />
        <button type="submit">Go ➔</button>
      </form>
    </div>

    <div class="content">
      <div class="card">
        <div style="font-size: 13px; font-weight: bold; color: #94a3b8; margin-bottom: 12px;">Түргэн хандах сайтууд:</div>
        
        <div class="site-item" onclick="setAndOpen('https://atsu.moe/')">
          🌸 Atsu Moe (https://atsu.moe/)
        </div>
        <div class="site-item" onclick="setAndOpen('https://www.webtoons.com/')">
          🟢 Webtoon (https://www.webtoons.com/)
        </div>
        <div class="site-item" onclick="setAndOpen('https://page.kakao.com/')">
          🟡 Kakao Page (https://page.kakao.com/)
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <button class="nav-btn">🌐 Browser</button>
      <button class="nav-btn" style="color: #64748b;">🕒 History</button>
    </div>
  </div>

  <script>
    function openSite(e) {
      if (e) e.preventDefault();
      let url = document.getElementById('urlInput').value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      window.open(url, '_blank');
    }

    function setAndOpen(url) {
      document.getElementById('urlInput').value = url;
      window.open(url, '_blank');
    }
  </script>

</body>
</html>
