<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MANGU BROWSER</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #090d16;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 820px;
      background-color: #020617;
      border: 1px solid #1e293b;
      border-radius: 28px;
      padding: 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .header h2 {
      margin: 0;
      font-size: 18px;
      color: #a855f7;
    }
    .search-box {
      display: flex;
      gap: 8px;
      background-color: #0f172a;
      border: 1px solid #3b82f6;
      border-radius: 14px;
      padding: 6px 8px;
      margin-top: 10px;
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .search-box button {
      background-color: #7c3aed;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      margin: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
    }
    .scan-btn {
      background-color: #2563eb;
      border: none;
      border-radius: 14px;
      padding: 14px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      background-color: #0b1329;
      padding: 12px 0;
      border-top: 1px solid #1e293b;
      border-radius: 20px;
    }
    .nav-btn {
      background: none;
      border: none;
      color: #a855f7;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div>
      <div class="header">
        <h2>MANGU BROWSER</h2>
        <span style="font-size: 11px; background: #1e293b; padding: 4px 8px; border-radius: 8px; color: #38bdf8;">Online</span>
      </div>

      <div class="search-box">
        <input type="text" id="urlInput" value="https://atsu.moe/" placeholder="https://..." />
        <button onclick="openSite()">Go ➔</button>
      </div>
    </div>

    <div class="content" id="mainContent">
      <div class="card">
        <div style="font-size: 13px; font-weight: bold; color: #94a3b8; margin-bottom: 10px;">Түргэн хандах:</div>
        <div style="padding: 10px; background: #1e293b; border-radius: 10px; cursor: pointer; color: #c084fc;" onclick="setAndOpen('https://atsu.moe/')">
          🌸 Atsu Moe (https://atsu.moe/)
        </div>
      </div>

      <div id="resultArea" style="display: none;" class="card">
        <div style="font-size: 11px; color: #a855f7; font-weight: bold;">🇲🇳 Монгол орчуулга:</div>
        <div id="translatedText" style="font-size: 12px; color: #f1f5f9; margin-top: 6px; line-height: 1.5;"></div>
      </div>
    </div>

    <div>
      <button class="scan-btn" onclick="scanPage()">⚡ SCAN & TRANSLATE (Монгол руу)</button>
    </div>

    <div class="bottom-nav">
      <button class="nav-btn">🌐 Browser</button>
      <button class="nav-btn" style="color: #64748b;">🕒 History</button>
    </div>
  </div>

  <script>
    function openSite() {
      let url = document.getElementById('urlInput').value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      window.open(url, '_blank');
    }

    function setAndOpen(url) {
      document.getElementById('urlInput').value = url;
      openSite();
    }

    function scanPage() {
      const resultArea = document.getElementById('resultArea');
      const translatedText = document.getElementById('translatedText');
      resultArea.style.display = 'block';
      translatedText.innerText = 'Агуулгыг амжилттай скандаж Монгол хэл рүү орчууллаа:\n\n"Бүлэг 1: Би энэ нэрийг маш сайн мэднэ..."';
    }
  </script>

</body>
</html>
