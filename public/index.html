<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MANGU BROWSER</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #090d16;
      border: 1px solid #1e293b;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .address-bar {
      display: flex;
      background-color: #020617;
      border: 1px solid #3b82f6;
      border-radius: 14px;
      padding: 8px 12px;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }
    .address-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .go-btn {
      background-color: #7c3aed;
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .quick-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }
    .site-btn {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #c084fc;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
    }
    .site-btn:hover {
      background-color: #1e293b;
      border-color: #a855f7;
    }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <div class="header">
        <h2 style="margin: 0; color: #a855f7;">MANGU BROWSER</h2>
        <span style="font-size: 12px; background: #1e293b; padding: 4px 8px; border-radius: 6px;">Proxy Active</span>
      </div>

      <form action="/proxy" method="GET" class="address-bar">
        <span>🌐</span>
        <input type="text" name="url" value="https://atsu.moe/" placeholder="URL хаяг бичнэ үү..." required />
        <button type="submit" class="go-btn">Go ➔</button>
      </form>

      <div class="quick-links">
        <p style="color: #94a3b8; font-size: 13px; margin-bottom: 5px;">Түргэн хандах:</p>
        <button class="site-btn" onclick="location.href='/proxy?url=https://atsu.moe/'">🌸 Atsu Moe (Scan-тай нээх)</button>
        <button class="site-btn" onclick="location.href='/proxy?url=https://webtoon.mn/'">🟢 Webtoon (Scan-тай нээх)</button>
      </div>
    </div>

    <p style="text-align: center; color: #64748b; font-size: 12px; margin-top: 20px;">
      Proxy сервер ашиглан нээх тул Scan товч сайт дээр дагаж явна.
    </p>
  </div>
</body>
</html>
