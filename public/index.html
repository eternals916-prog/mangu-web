<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MANGU BROWSER</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .browser-container {
      width: 100%;
      max-width: 480px;
      height: 750px;
      background-color: #090d16;
      border: 1px solid #1e293b;
      border-radius: 28px;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      font-size: 18px;
      font-weight: 900;
      color: #a855f7;
    }
    .address-bar {
      display: flex;
      background-color: #020617;
      border: 1px solid #3b82f6;
      border-radius: 14px;
      padding: 8px 12px;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }
    .address-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .go-btn {
      background-color: #7c3aed;
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
    .go-btn:hover {
      background-color: #6d28d9;
    }
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 16px;
    }
    .quick-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .site-btn {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #c084fc;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
    }
    .site-btn:hover {
      background-color: #1e293b;
      border-color: #a855f7;
    }
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      background-color: #020617;
      padding: 12px 0;
      border-top: 1px solid #1e293b;
      border-radius: 20px;
    }
    .nav-btn {
      background: none;
      border: none;
      color: #a855f7;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="browser-container">
    <div>
      <div class="header">
        <div class="logo">MANGU BROWSER</div>
        <span style="font-size: 10px; background: #1e293b; padding: 4px 8px; border-radius: 8px; color: #38bdf8;">Online</span>
      </div>

      <!-- Address Bar -->
      <form onsubmit="navigate(event)" class="address-bar">
        <span>🌐</span>
        <input type="text" id="urlInput" value="https://atsu.moe/" placeholder="https://..." />
        <button type="submit" class="go-btn">Go ➔</button>
      </form>
    </div>

    <!-- Content / Quick Links -->
    <div class="content-area">
      <div style="width: 100%;">
        <div style="font-size: 13px; color: #94a3b8; margin-bottom: 12px; text-align: left;">Түргэн хандах сайтууд:</div>
        <div class="quick-links">
          <button class="site-btn" onclick="openExternal('https://atsu.moe/')">🌸 Atsu Moe (atsu.moe)</button>
          <button class="site-btn" onclick="openExternal('https://www.webtoons.com/')">🟢 Webtoon (webtoons.com)</button>
          <button class="site-btn" onclick="openExternal('https://page.kakao.com/')">🟡 Kakao Page (page.kakao.com)</button>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <button class="nav-btn">🌐 Browser</button>
      <button class="nav-btn" style="color: #64748b;">🕒 History</button>
    </div>
  </div>

  <script>
    function navigate(e) {
      if (e) e.preventDefault();
      let url = document.getElementById('urlInput').value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      window.open(url, '_blank');
    }

    function openExternal(url) {
      document.getElementById('urlInput').value = url;
      window.open(url, '_blank');
    }
  </script>

</body>
</html>
